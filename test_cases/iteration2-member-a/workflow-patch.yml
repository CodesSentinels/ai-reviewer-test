name: Code Review

permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]
  # 迭代二 成员 A：新增顶层 PR 评论触发器（issue_comment 事件）
  issue_comment:
    types: [created]

concurrency:
  # 对 issue_comment 使用独立的 group key，并发 PR 评论互不影响
  group: ${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.head_ref || github.sha }}-${{ github.workflow }}-${{ github.event_name == 'issue_comment' && 'pr_issue_comment' || github.event_name == 'pull_request_review_comment' && 'pr_comment' || 'pr' }}
  # 只取消同一 PR 的自动 review 任务；命令事件不允许取消
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  review:
    runs-on: ubuntu-latest
    # issue_comment 也会被 non-PR issue 触发；提前过滤以节约 Actions 时长
    if: |
      github.event_name != 'issue_comment' ||
      github.event.issue.pull_request != null
    steps:
      - uses: CodesSentinels/ai-reviewer@feature/cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          debug: true
          review_simple_changes: false
          review_comment_lgtm: false
          openai_heavy_model: gpt-4.1
