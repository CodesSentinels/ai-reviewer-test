name: Code Review

permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

concurrency:
  # Bot-triggered events (e.g. the ACK comment from resolve) get a unique group
  # per run so they never cancel the human-triggered resolve run.
  group: >-
    ${{ github.event.sender.type == 'Bot'
        && format('bot-noop-{0}', github.run_id)
        || format('{0}-{1}-{2}-{3}',
             github.repository,
             github.event.number || github.head_ref || github.sha,
             github.workflow,
             github.event_name == 'pull_request_review_comment' && 'pr_comment' || 'pr') }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_review_comment' }}

jobs:
  review:
    runs-on: ubuntu-latest
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name != 'issue_comment' ||
      github.event.issue.pull_request != null)
    steps:
      # 生成 GitHub App installation token
      - uses: actions/create-github-app-token@v1
        id: bot-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/checkout@v4
      - name: Debug - Print all environment variables
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: env | sort

      # 指定 ai-reviewer 分支（测试完成后改回动态解析或 main）
      - uses: actions/checkout@v4
        with:
          repository: CodesSentinels/ai-reviewer
          ref: feature/invalid-cmd
          path: .github/ai-reviewer-action
          token: ${{ steps.bot-token.outputs.token }}
      - uses: ./.github/ai-reviewer-action
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          # ── General Settings ──────────────────────────────────────
          bot_github_login: "codesentinel-review-bot[bot]"
          bot_name: "CodeSentinel"
          bot_icon: "🦉"
          language: "zh-CN"
          command_ack_reaction: "rocket"
          debug: true

          # ── Review Control ────────────────────────────────────────
          disable_review: false
          disable_release_notes: false
          max_files: 150
          max_review_comments: 20
          review_simple_changes: false
          review_comment_lgtm: false
          path_filters: |
            **/*.ts
            **/*.vue
            **/*.js
            **/*.md
            **/*.yml
            **/*.yaml
            package.json
            !**/*.lock
            !node_modules/**
            !dist/**
            !.output/**

          # ── Model Configuration ──────────────────────────────────
          openai_base_url: "https://api.openai.com/v1"
          openai_light_model: "gpt-5.4-nano"
          openai_heavy_model: "gpt-5.4-mini"
          openai_model_temperature: "0.0"
          openai_retries: 5
          openai_timeout_ms: 360000
          openai_concurrency_limit: 6
          github_concurrency_limit: 6

          # ── AI Capabilities (Tool Use) ───────────────────────────
          enable_shell: true
          enable_web_search: true

          # ── Cross-File Dependency Analysis ───────────────────────
          enable_dependency_analysis: true
          max_dependency_files: 50

          # ── Static Analysis (Master Switch) ──────────────────────
          enable_lint_tools: true

          # ── Per-Tool Enable Flags ────────────────────────────────
          enable_eslint: true
          enable_biome: true
          enable_tsc: true
          enable_prettier: false
          enable_semgrep: true

          # ── Per-Tool Version Pinning ────────────────────────────
          eslint_version: "^9.15.0"
          biome_version: "^2.3.0"
          tsc_version: "^5.6.0"
          prettier_version: "^3.0.0"
