name: Code Review

permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  push:
    branches:
      - main
      - "test/dev*"
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

concurrency:
  # Bot-triggered events (e.g. the ACK comment from resolve) get a unique group
  # per run so they never cancel the human-triggered resolve run.
  group: >-
    ${{ github.event.sender.type == 'Bot'
        && format('bot-noop-{0}', github.run_id)
        || format('{0}-{1}-{2}-{3}',
             github.repository,
             github.event.number || github.head_ref || github.sha,
             github.workflow,
             github.event.comment.id || 'pr') }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_review_comment' &&
    github.event_name != 'issue_comment' }}

jobs:
  review:
    runs-on: ubuntu-latest
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name != 'issue_comment' ||
      github.event.issue.pull_request != null)
    steps:
      # 生成 GitHub App installation token
      - uses: actions/create-github-app-token@v1
        id: bot-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 固定使用 ai-reviewer 的 main 分支作为 action 源码
      - uses: actions/checkout@v4
        with:
          repository: CodesSentinels/ai-reviewer
          ref: main
          path: .github/ai-reviewer-action
          token: ${{ steps.bot-token.outputs.token }}
      - uses: ./.github/ai-reviewer-action
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          bot_github_login: "codesentinel-review-bot[bot]"
          # resolve_token: ${{ secrets.BOT_PAT }}
          debug: true
          review_simple_changes: false
          review_comment_lgtm: false
          openai_heavy_model: gpt-5.4-mini
          enable_shell: true
          enable_web_search: true
          enable_dependency_analysis: true
          path_filters: |
            **/*.ts
            **/*.vue
            **/*.js
            **/*.md
            **/*.yml
            **/*.yaml
            package.json
            !**/*.lock
            !node_modules/**
            !dist/**
            !.output/**
          enable_lint_tools: true
          enable_semgrep: true
          debug_resolve_inject_failures: "3"
